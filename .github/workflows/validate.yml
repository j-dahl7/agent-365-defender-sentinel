name: Validate Agent 365 lab safety

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Enforce hash-locked runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Parse Bash entry points
        run: bash -n scripts/deploy-lab.sh scripts/cleanup.sh

      - name: Compile resource and Sentinel Bicep
        run: |
          az bicep build --file infra/main.bicep --stdout >/dev/null
          az bicep build --file infra/sentinel-rules.bicep --stdout >/dev/null

      - name: Run offline safety tests
        run: python -m unittest discover -s tests -v
